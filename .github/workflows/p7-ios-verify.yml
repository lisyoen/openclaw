# P7 T-Native 전용 검증: macOS runner에서 unsigned iOS 테스트/빌드.
# 기존 macOS/OpenClaw release workflow와 독립. 비밀·서명·배포 없음.
name: p7-ios-verify

on:
  workflow_dispatch:
  push:
    branches: [p7-tnative]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/p7-ios-verify.yml'

concurrency:
  group: p7-ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Swift 6.2 필요)
        run: |
          ls -d /Applications/Xcode*.app | sort -V
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "selecting $LATEST"
          sudo xcode-select -s "$LATEST"

      - name: Xcode version
        run: xcodebuild -version && xcrun simctl list devices available | head -20

      - name: Install tools (XcodeGen)
        run: brew install xcodegen

      - name: Strip lint phases (P7 검증은 컴파일·테스트만 — 사용자 WIP 트리 스타일 미게이팅)
        run: |
          python3 - <<'PY'
          lines = open('project.yml').read().split('\n')
          out, skip = [], False
          for ln in lines:
              if ln == '    preBuildScripts:':
                  skip = True
                  continue
              if skip and ln.strip() and not ln.startswith('      '):
                  skip = False
              if not skip:
                  out.append(ln)
          open('project.yml', 'w').write('\n'.join(out))
          print('lint phases stripped:', 'preBuildScripts' not in open('project.yml').read())
          PY

      - name: Generate project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project OpenClaw.xcodeproj -scheme OpenClaw

      - name: iOS unit tests (simulator, unsigned)
        run: |
          set +e
          xcodebuild test \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            > xcodebuild-test.log 2>&1
          RC=$?
          echo "== 요약 =="; tail -30 xcodebuild-test.log
          echo "== 실패 테스트 =="
          grep -E '✘|recorded an issue|Expectation failed|Test .* failed' xcodebuild-test.log | head -80
          exit $RC

      - name: Simulator unsigned build (Release config off, Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tail -80

      - name: Upload test results (진단용, 비밀 없음)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p7-ios-test-results
          path: |
            apps/ios/TestResults.xcresult
            apps/ios/xcodebuild-test.log
          retention-days: 7
